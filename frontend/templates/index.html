{% extends "base.html" %}
{% block content %}
    <section class="home-hero text-center">
        <div class="home-art-orbit" aria-label="Höchstrangige unbewertete Auktionsbilder">
            <div class="home-orbit-stage">
                {% for preview in auction_image_previews %}
                    <a class="home-orbit-card home-orbit-card-{{ loop.index0 }}"
                       href="{{ url_for('match', match_id=preview.match_id, rating='unrated', sort='similarity', bookmarked='false', image_weight=50) }}"
                       title="{{ preview.title or 'Auktionswerk' }}">
                        <img src="{{ url_for('db_image_auction', artwork_id=preview.artwork_id) }}"
                             alt="Auktionsbild{% if preview.title %}: {{ preview.title }}{% endif %}"
                             loading="{{ 'eager' if loop.index <= 3 else 'lazy' }}" />
                    </a>
                {% endfor %}
                <div class="home-logo-shell">
                    <img src="{{ url_for('static', filename='logo_smartmatch.png') }}"
                         alt="SmartMatch"
                         width=""
                         height="72"
                         class="home-logo" />
                </div>
            </div>
        </div>
        <div class="home-copy mx-auto">
            <p class="text-uppercase small text-primary fw-semibold letter-spaced mb-2">
                Top unbewertete Auktionsbilder
            </p>
            <p class="lead fw-normal mb-3">
                Es sind <b>{{ match_count }}</b> neue Matches vorhanden.
            </p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                {% if match_count > 1 %}
                    <a class="btn btn-primary"
                       role="button"
                       href="{{ url_for('match_redirect') }}"><i class="bi bi-play-circle me-1" aria-hidden="true"></i>Auswerten</a>
                {% else %}
                    <span class="btn btn-primary disabled" role="button"><i class="bi bi-play-circle me-1" aria-hidden="true"></i>Auswerten</span>
                {% endif %}
                <a class="btn btn-outline-primary"
                   role="button"
                   href="{{ url_for('match_list') }}"><i class="bi bi-list-ul me-1" aria-hidden="true"></i>Neu Matches</a>
                <a class="btn btn-outline-primary"
                   role="button"
                   href="{{ url_for('stats_dashboard') }}"><i class="bi bi-bar-chart-line me-1" aria-hidden="true"></i>Statistik</a>
            </div>
        </div>
    </section>
{% endblock content %}
