[unix_http_server]
file=/tmp/smartmatch-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/smartmatch-supervisor.sock

[eventlistener:essential-process-fatal]
command=python -m scrapers.supervisor_events
directory=/app
events=PROCESS_STATE_FATAL
buffer_size=10
autostart=true
autorestart=true
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:scraper-dashboard]
command=python -m scraper_dashboard
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0

[program:scraper-scheduler]
command=python -m scrapers.scheduler
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
